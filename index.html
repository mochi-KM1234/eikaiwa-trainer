<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>英会話フレーズトレーナー</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #2563eb; --primary-light: #eff6ff;
      --success: #16a34a; --warning: #d97706; --danger: #dc2626;
      --text: #1f2937; --text-sub: #6b7280; --border: #e5e7eb;
      --bg: #f3f4f6; --card: #ffffff; --radius: 14px;
      --shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    #root { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

    .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 16px;
      display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; }
    .header-title { font-size: 17px; font-weight: 700; flex: 1; }

    .nav { background: var(--card); border-top: 1px solid var(--border); display: flex;
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px; z-index: 100; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 9px 4px 12px; border: none; background: none; font-size: 10px;
      color: var(--text-sub); cursor: pointer; gap: 3px; transition: color .15s; }
    .nav-item.active { color: var(--primary); }
    .nav-item svg { width: 22px; height: 22px; }

    .content { flex: 1; padding: 16px; padding-bottom: 80px; overflow-y: auto; }

    .card { background: var(--card); border-radius: var(--radius); padding: 16px;
      box-shadow: var(--shadow); margin-bottom: 12px; }

    .btn { border: none; border-radius: 10px; padding: 13px 20px; font-size: 15px;
      font-weight: 600; cursor: pointer; display: inline-flex; align-items: center;
      justify-content: center; gap: 6px; transition: opacity .1s, transform .1s;
      -webkit-user-select: none; user-select: none; font-family: inherit; }
    .btn:active { opacity: .78; transform: scale(.97); }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn-primary { background: var(--primary); color: white; width: 100%; }
    .btn-success { background: var(--success); color: white; }
    .btn-warning { background: var(--warning); color: white; }
    .btn-danger  { background: var(--danger); color: white; }
    .btn-purple  { background: #7c3aed; color: white; }
    .btn-ghost   { background: white; color: var(--text); border: 1.5px solid var(--border); }
    .btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 8px; }
    .w-full { width: 100%; }

    .score-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 16px; }
    .score-btn { border: none; border-radius: 12px; padding: 16px 8px; font-size: 13px;
      font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center;
      gap: 4px; transition: opacity .1s, transform .1s; -webkit-user-select: none; font-family: inherit; }
    .score-btn:active { opacity: .78; transform: scale(.97); }
    .score-btn .emoji { font-size: 22px; }
    .score-again { background: #fee2e2; color: var(--danger); }
    .score-hard  { background: #fef3c7; color: #92400e; }
    .score-easy  { background: #dcfce7; color: #166534; }

    .input { width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
      padding: 12px 14px; font-size: 15px; font-family: inherit; outline: none;
      background: white; transition: border-color .2s; color: var(--text); }
    .input:focus { border-color: var(--primary); }
    textarea.input { resize: none; }

    .tag { display: inline-block; background: var(--primary-light); color: var(--primary);
      padding: 4px 12px; border-radius: 99px; font-size: 13px; font-weight: 600; }

    .study-card { background: var(--card); border-radius: 18px; padding: 28px 20px 24px;
      text-align: center; box-shadow: 0 2px 16px rgba(0,0,0,.07); margin-bottom: 16px; }
    .study-cat { font-size: 12px; color: var(--text-sub); margin-bottom: 10px; letter-spacing:.05em; }
    .study-jp { font-size: 22px; font-weight: 700; line-height: 1.5; margin-bottom: 14px; }
    .hint-area { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 32px; }
    .answer-en { font-size: 20px; font-weight: 700; color: var(--primary); line-height: 1.5; }

    .compare-box { background: #f8faff; border: 1.5px solid #c7d7f5; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .compare-row { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; font-size: 14px; }
    .compare-row:last-child { margin-bottom: 0; }
    .compare-label { font-size: 11px; font-weight: 700; color: var(--text-sub); min-width: 60px;
      background: var(--border); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
    .compare-text { flex: 1; line-height: 1.5; }
    .compare-text.correct { color: var(--primary); font-weight: 700; }
    .compare-text.user-ans { color: var(--text); }

    .prog-wrap { background: var(--border); border-radius: 99px; height: 5px; flex: 1; }
    .prog-fill { height: 100%; border-radius: 99px; background: var(--primary); transition: width .4s; }

    .feedback-box { border-radius: var(--radius); padding: 14px 16px; margin-top: 10px; }
    .fb-perfect { background: #f0fdf4; border: 1.5px solid #86efac; }
    .fb-good    { background: #eff6ff; border: 1.5px solid #93c5fd; }
    .fb-ok      { background: #fffbeb; border: 1.5px solid #fcd34d; }
    .fb-retry   { background: #fff1f2; border: 1.5px solid #fca5a5; }

    .idiom-box { background: #fdf4ff; border: 1.5px solid #e9d5ff; border-radius: var(--radius); padding: 14px 16px; margin-top: 10px; }
    .idiom-item { margin-bottom: 10px; }
    .idiom-item:last-child { margin-bottom: 0; }
    .idiom-term { font-size: 14px; font-weight: 700; color: #7c3aed; margin-bottom: 3px; }
    .idiom-note { font-size: 13px; color: var(--text); line-height: 1.6; }

    .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .stat-card { background: var(--card); border-radius: var(--radius); padding: 14px;
      text-align: center; box-shadow: var(--shadow); }
    .stat-num { font-size: 26px; font-weight: 700; color: var(--primary); }
    .stat-label { font-size: 11px; color: var(--text-sub); margin-top: 3px; }

    .cat-btn { display: flex; align-items: center; background: white; border: 1.5px solid var(--border);
      border-radius: 12px; padding: 14px 16px; font-size: 14px; cursor: pointer; width: 100%;
      margin-bottom: 8px; font-weight: 500; font-family: inherit; transition: all .15s; text-align: left; }
    .cat-btn:active { border-color: var(--primary); background: var(--primary-light); }

    .phrase-item { background: var(--card); border-radius: var(--radius); padding: 14px 16px;
      margin-bottom: 8px; box-shadow: var(--shadow); }

    .section-label { font-size: 12px; font-weight: 700; color: var(--text-sub);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }

    .session-done { text-align: center; padding: 48px 20px; }
    .session-done .big-emoji { font-size: 64px; margin-bottom: 16px; }
    .session-done h2 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }

    .flex { display: flex; } .gap-8 { gap: 8px; } .gap-6 { gap: 6px; }
    .items-center { align-items: center; } .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; } .flex-1 { flex: 1; }
    .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
    .mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; }
    .text-sm { font-size: 13px; } .text-xs { font-size: 11px; }
    .text-sub { color: var(--text-sub); } .font-bold { font-weight: 700; }
    .text-center { text-align: center; } .line-h16 { line-height: 1.6; }
    .divider { height: 1px; background: var(--border); margin: 14px 0; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useCallback } = React;

// ── Keys ──────────────────────────────────────────────────────────
const KEYS = { progress:'ept_prog_v4', logs:'ept_logs_v4' };

// ── Utils ─────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2,10);
const now = () => new Date().toISOString();
const daysLater = (d) => new Date(Date.now() + d*86400000).toISOString();

const STOP = new Set(['the','a','an','to','of','for','and','is','are','i','you','me','my','we',
  'this','that','it','in','on','with','some','more','could','would','may','like','please','have',
  'be','do','at','by','from','or','not','so','if','as','up','out','but','can','just','here','there',
  'get','all','had','has','him','his','her','our','its','was','say','they','she','what','when',
  'how','who','which','very','also','back','into','than','then','now','only','over','such','down',
  'no','any','been','come','give','take','where','while','about','should','make','first','well',
  'same','came','away','these','other','most','did','does','need','want','go','let','put','see',
  'use','way','one','new','will','still','each','those']);

function guessKw(english) {
  return [...new Set(english.toLowerCase().replace(/[^a-z0-9\s'-]/g,' ').split(/\s+/)
    .filter(w => w.length >= 3 && !STOP.has(w)).slice(0,4))];
}
function norm(s) {
  return (s||'').toLowerCase().replace(/['']/g,"'").replace(/[^a-z0-9\s']/g,' ').replace(/\s+/g,' ').trim();
}

// ── Category data ─────────────────────────────────────────────────
const CAT_DATA = [
  { id:'c1',  name:'聞き返しフレーズ',           sortOrder:1  },
  { id:'c2',  name:'空港フレーズ',               sortOrder:2  },
  { id:'c3',  name:'機内フレーズ',               sortOrder:3  },
  { id:'c4',  name:'建築の職場フレーズ',         sortOrder:4  },
  { id:'c5',  name:'入国審査フレーズ',           sortOrder:5  },
  { id:'c6',  name:'ホテルフレーズ',             sortOrder:6  },
  { id:'c7',  name:'移動・タクシーフレーズ',     sortOrder:7  },
  { id:'c8',  name:'カフェ・レストランフレーズ', sortOrder:8  },

  { id:'c11', name:'ベトナム出張｜職場・会議',   sortOrder:11 },
  { id:'c12', name:'ベトナム出張｜交流・雑談',   sortOrder:12 },

// ── Phrase data ───────────────────────────────────────────────────

      { label:"より丁寧", text:"I'm sorry, I didn't quite catch that. Could you repeat it?" },
      { label:"カジュアル", text:"Sorry, I missed that." }

  },
  {

  // ── c2 空港フレーズ ──────────────────────────────────────────────

    japanese:"チェックインカウンターはどこですか？", categoryId:'c2',
    idioms:[{ term:"check-in counter", note:"チェックインの受付カウンター。「check in」は動詞（する）、「check-in」は名詞・形容詞（の）として使います。" }],

// ── Storage hook ──────────────────────────────────────────────────
function useStorage(key, init) {
  const [state, setState] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; }
  });
  const upd = useCallback((fn) => {
    setState(prev => {
      const next = typeof fn === 'function' ? fn(prev) : fn;
      try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
      return next;
    });
  }, [key]);
  return [state, upd];
}

// ── SM-2 ──────────────────────────────────────────────────────────
function defProg(phraseId) {
  return { phraseId, streak:0, intervalDays:0, nextReviewAt:now(), totalReviews:0, lastScore:null, easeFactor:2.5 };
}
function nextProg(p, score) {
  const n = { ...p, totalReviews:p.totalReviews+1, lastScore:score };
  if (score==='again') {
    n.streak=0; n.intervalDays=0; n.easeFactor=Math.max(1.3, n.easeFactor-0.2); n.nextReviewAt=daysLater(0);
  } else if (score==='hard') {
    n.streak=Math.max(1,n.streak+1); n.intervalDays=Math.max(1,Math.round((n.intervalDays||1)*1.3));
    n.easeFactor=Math.max(1.5,n.easeFactor-0.05); n.nextReviewAt=daysLater(n.intervalDays);
  } else {
    n.streak+=1; n.easeFactor=Math.min(3.0,n.easeFactor+0.08);
    n.intervalDays=n.intervalDays===0?2:Math.round(n.intervalDays*n.easeFactor);
    n.nextReviewAt=daysLater(n.intervalDays);
  }
  return n;
}

// ── Feedback ──────────────────────────────────────────────────────
function buildFeedback(userAnswer, phrase) {
  if (!userAnswer.trim()) return null;
  const u=norm(userAnswer), c=norm(phrase.english);
  const uW=u.split(' '), cW=c.split(' ');
  const ratio = cW.length ? cW.filter(w=>uW.includes(w)).length/cW.length : 0;
  const exact = u===c;
  const improved = phrase.english.replace(/^Can you /,'Could you ').replace(/^I want to /,"I'd like to ");
  const casual = phrase.english.replace(/^Could you /,'Can you ').replace(/^Could I /,'Can I ').replace(/^May I /,'Can I ').replace(/^I would like to /,"I'd like to ");
  if (exact)      return { level:'perfect', icon:'🎯', msg:'パーフェクト！そのまま使えます。', improved, casual };
  if (ratio>=0.8) return { level:'good',    icon:'👍', msg:'ほぼ正解！細かい部分だけ確認を。', improved, casual };
  if (ratio>=0.45)return { level:'ok',      icon:'🤔', msg:'伝わりそうですが、より自然な言い方を確認しましょう。', improved, casual };
  return           { level:'retry',  icon:'💪', msg:'正解フレーズを確認して、もう一度チャレンジ！', improved, casual };
}

// ── Clipboard ─────────────────────────────────────────────────────
function copyText(text) {
  if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text).catch(()=>fallback(text));
  fallback(text);
}
function fallback(text) {
  const ta = document.createElement('textarea');
  ta.value=text; ta.style.cssText='position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
}
function makePrompt(phrase, userAnswer) {
  return `英会話フレーズの添削をお願いします。

【問題（日本語）】${phrase.japanese}
【正解フレーズ】${phrase.english}
【私の回答】${userAnswer || '（未入力）'}

以下を教えてください：
1. 私の回答の自然さ（5段階評価）
2. 改善点があれば具体的に
3. よりネイティブな言い方があれば
4. このフレーズを使う場面のワンポイントアドバイス`;
}

// ═══════════════════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════════════════
function App() {
  const initProg = useMemo(() => Object.fromEntries(PHRASE_DATA.map(p=>[p.id,defProg(p.id)])), []);
  const [progMap, updProg] = useStorage(KEYS.progress, initProg);
  const [logs,    updLogs] = useStorage(KEYS.logs,     []);

  const [screen, setScreen]    = useState('home');
  const [studyState, setStudy] = useState(null);

  const cats       = CAT_DATA;
  const phrases    = PHRASE_DATA;
  const sortedCats = useMemo(() => [...cats].sort((a,b)=>a.sortOrder-b.sortOrder), [cats]);
  const totalPhrases = phrases.length;
  const totalReviews = Object.values(progMap).reduce((s,p)=>s+(p.totalReviews||0),0);
  const todayCount   = logs.filter(l=>new Date(l.reviewedAt).toDateString()===new Date().toDateString()).length;

  function startStudy(mode, catId) {
    let target = [...phrases];
    if (mode==='category'&&catId) target=target.filter(p=>p.categoryId===catId);
    if (mode==='weak') target=target.filter(p=>{ const pr=progMap[p.id]||defProg(p.id); return pr.lastScore==='again'||pr.intervalDays<=1; });
    target.sort((a,b)=>new Date((progMap[a.id]||defProg(a.id)).nextReviewAt)-new Date((progMap[b.id]||defProg(b.id)).nextReviewAt));
    const ids = target.slice(0,10).map(p=>p.id);
    if (!ids.length) { alert('練習できるフレーズがありません。'); return; }
    setStudy({ ids, index:0, showAnswer:false, answer:'', showHint:false, feedback:null });
    setScreen('study');
  }

  function revealAnswer() {
    const phrase = phrases.find(p=>p.id===studyState?.ids[studyState.index]);
    if (!phrase) return;
    setStudy(s=>({ ...s, showAnswer:true, feedback:buildFeedback(s.answer, phrase) }));
  }

  function recordScore(score) {
    const pid = studyState?.ids[studyState.index];
    updProg(prev=>({...prev,[pid]:nextProg(prev[pid]||defProg(pid),score)}));
    updLogs(prev=>[{id:uid(),phraseId:pid,selfScore:score,userAnswer:studyState.answer,reviewedAt:now()},...prev].slice(0,2000));
    const next = studyState.index+1;
    if (next>=studyState.ids.length) setStudy(s=>({...s,index:next}));
    else setStudy(s=>({...s,index:next,showAnswer:false,answer:'',showHint:false,feedback:null}));
  }

  const NAV = [
    { key:'home',  icon:<IconHome />,  label:'ホーム' },
    { key:'study', icon:<IconCards />, label:'練習' },
    { key:'list',  icon:<IconList />,  label:'一覧' },
  ];
  const TITLES = { home:'英会話トレーナー', study:'練習', list:'フレーズ一覧' };
  const VERSION_LABEL = 'GitHub Pages公開用';

  return (
    <div>
      <div className="header">
        <div className="header-title">{TITLES[screen]}</div>
        <span style={{fontSize:'10px',color:'#92400e',background:'#fef3c7',padding:'2px 8px',borderRadius:'99px',fontWeight:700,whiteSpace:'nowrap'}}>{VERSION_LABEL}</span>
      </div>
      <div className="content">
        {screen==='home'  && <HomeScreen sortedCats={sortedCats} phrases={phrases} totalPhrases={totalPhrases} totalReviews={totalReviews} todayCount={todayCount} onStart={startStudy} />}
        {screen==='study' && <StudyScreen state={studyState} setState={setStudy} phrases={phrases} cats={cats} onReveal={revealAnswer} onScore={recordScore} onExit={()=>setScreen('home')} />}
        {screen==='list'  && <ListScreen phrases={phrases} cats={sortedCats} progMap={progMap} />}
      </div>
      <nav className="nav">
        {NAV.map(item=>(
          <button key={item.key} className={`nav-item ${screen===item.key?'active':''}`}
            onClick={()=>{ if(item.key==='study'){if(phrases.length)startStudy('all');}else setScreen(item.key); }}>
            {item.icon}
            {item.label}
          </button>
        ))}
      </nav>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// HOME
// ═══════════════════════════════════════════════════════════════════
function HomeScreen({ sortedCats, phrases, totalPhrases, totalReviews, todayCount, onStart }) {
  return (
    <div>
      <div className="stats-row">
        <div className="stat-card"><div className="stat-num">{totalPhrases}</div><div className="stat-label">フレーズ</div></div>
        <div className="stat-card"><div className="stat-num">{totalReviews}</div><div className="stat-label">総練習回数</div></div>
        <div className="stat-card"><div className="stat-num">{todayCount}</div><div className="stat-label">今日の回数</div></div>
      </div>
      <button className="btn btn-primary mb-8" onClick={()=>onStart('all')}>▶ 今日の練習（全カテゴリ）</button>
      <button className="btn btn-ghost w-full mb-16" onClick={()=>onStart('weak')}>🔥 苦手フレーズを集中練習</button>
      <div className="section-label">カテゴリ別に練習</div>
      {sortedCats.map(cat=>{
        const cnt=phrases.filter(p=>p.categoryId===cat.id).length;
        return(
          <button key={cat.id} className="cat-btn" onClick={()=>onStart('category',cat.id)}>
            <span className="flex-1">{cat.name}</span>
            <span style={{fontSize:12,color:'#9ca3af'}}>{cnt}件 ›</span>
          </button>
        );
      })}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// STUDY
// ═══════════════════════════════════════════════════════════════════
function StudyScreen({ state, setState, phrases, cats, onReveal, onScore, onExit }) {
  if (!state) return null;
  const { ids, index, showAnswer, answer, showHint, feedback } = state;

  if (index>=ids.length) return(
    <div className="session-done">
      <div className="big-emoji">🎉</div>
      <h2>セッション完了！</h2>
      <p className="text-sub mt-8">{ids.length}問 お疲れ様でした</p>
      <div className="mt-16"><button className="btn btn-primary" onClick={onExit}>ホームに戻る</button></div>
    </div>
  );

  const phrase = phrases.find(p=>p.id===ids[index]);
  if (!phrase) return null;
  const cat      = cats.find(c=>c.id===phrase.categoryId);
  const kws      = guessKw(phrase.english);
  const idioms   = phrase.idioms   || [];
  const variants = phrase.variations || [];
  const progress = (index/ids.length)*100;
  const fbClass  = { perfect:'fb-perfect', good:'fb-good', ok:'fb-ok', retry:'fb-retry' };

  function requestClaude() {
    copyText(makePrompt(phrase, answer));
    window.open('https://claude.ai', '_blank');
    setTimeout(()=>alert('プロンプトをコピーしました！\n開いたClaudeのタブで Ctrl+V で貼り付けてください。'), 300);
  }

  return(
    <div>
      <div className="flex items-center gap-8 mb-12">
        <button className="btn btn-ghost btn-sm" onClick={onExit}>✕ 終了</button>
        <div className="prog-wrap"><div className="prog-fill" style={{width:`${progress}%`}}></div></div>
        <span className="text-sm text-sub">{index+1}/{ids.length}</span>
      </div>

      <div className="study-card">
        <div className="study-cat">{cat?.name}</div>
        <div className="study-jp">{phrase.japanese}</div>
        {!showHint
          ? <button className="btn btn-ghost btn-sm" onClick={()=>setState(s=>({...s,showHint:true}))}>💡 ヒントを見る</button>
          : <div className="hint-area">
              {kws.length>0 ? kws.map(kw=><span key={kw} className="tag">{kw}</span>) : <span className="text-sm text-sub">ヒントなし</span>}
            </div>
        }
      </div>

      {!showAnswer && (
        <div>
          <textarea className="input mb-8" rows={3}
            placeholder="英語で答えを入力してください"
            value={answer} onChange={e=>setState(s=>({...s,answer:e.target.value}))} />
          <button className="btn btn-primary" onClick={onReveal}>
            {answer.trim() ? '✓ 答えを確認する ＋ 添削' : '→ 答えだけ確認する'}
          </button>
        </div>
      )}

      {showAnswer && (
        <div>
          <div className="compare-box">
            <div className="section-label" style={{marginBottom:10}}>回答比較</div>
            <div className="compare-row">
              <span className="compare-label">あなたの回答</span>
              <span className="compare-text user-ans">{answer.trim() || '（未入力）'}</span>
            </div>
            <div className="divider" style={{margin:'10px 0'}}></div>
            <div className="compare-row">
              <span className="compare-label">正解</span>
              <span className="compare-text correct">{phrase.english}</span>
            </div>
          </div>

          {feedback ? (
            <div className={`feedback-box ${fbClass[feedback.level]}`}>
              <div style={{fontSize:15,fontWeight:700,marginBottom:8}}>{feedback.icon} {feedback.msg}</div>
              {norm(feedback.improved)!==norm(phrase.english) && (
                <div className="text-sm mt-8"><span className="font-bold">より丁寧：</span> {feedback.improved}</div>
              )}
              {norm(feedback.casual)!==norm(phrase.english) && norm(feedback.casual)!==norm(feedback.improved) && (
                <div className="text-sm mt-8"><span className="font-bold">カジュアル：</span> {feedback.casual}</div>
              )}
              <div className="mt-12">
                <button className="btn btn-purple btn-sm" onClick={requestClaude}>
                  🤖 Claudeに詳しい添削を依頼（コピー＋タブを開く）
                </button>
              </div>
            </div>
          ) : (
            <div className="card" style={{color:'var(--text-sub)',fontSize:14}}>未入力のため添削なし</div>
          )}

          {idioms.length>0 && (
            <div className="idiom-box">
              <div className="section-label">💡 イディオム・表現解説</div>
              {idioms.map((id,i)=>(
                <div key={i} className="idiom-item">
                  <div className="idiom-term">{id.term}</div>
                  <div className="idiom-note">{id.note}</div>
                </div>
              ))}
            </div>
          )}

          {variants.length>0 && (
            <div className="idiom-box" style={{background:'#f0fdf4', borderColor:'#86efac'}}>
              <div className="section-label">🔄 バリエーション</div>
              {variants.map((v,i)=>(
                <div key={i} className="idiom-item">
                  <div className="idiom-term" style={{color:'#16a34a'}}>{v.label}</div>
                  <div className="idiom-note">{v.text}</div>
                </div>
              ))}
            </div>
          )}

          <div className="score-grid">
            <button className="score-btn score-again" onClick={()=>onScore('again')}>
              <span className="emoji">😓</span><span>できない</span><span style={{fontSize:10,opacity:.7}}>すぐ復習</span>
            </button>
            <button className="score-btn score-hard" onClick={()=>onScore('hard')}>
              <span className="emoji">🤔</span><span>むずかしい</span><span style={{fontSize:10,opacity:.7}}>近日中</span>
            </button>
            <button className="score-btn score-easy" onClick={()=>onScore('easy')}>
              <span className="emoji">😄</span><span>できた！</span><span style={{fontSize:10,opacity:.7}}>間隔を延ばす</span>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// LIST
// ═══════════════════════════════════════════════════════════════════
function ListScreen({ phrases, cats, progMap }) {
  const [search, setSearch]     = useState('');
  const [openCats, setOpenCats] = useState({});

  const q           = search.toLowerCase();
  const isSearching = q.length > 0;

  return (
    <div>
      <input className="input mb-12" placeholder="🔍 英語・日本語で検索"
        value={search} onChange={e => setSearch(e.target.value)} />

      {isSearching ? (
        phrases
          .filter(p => `${p.english} ${p.japanese}`.toLowerCase().includes(q))
          .map(p => (
            <PhraseRow key={p.id} phrase={p}
              cat={cats.find(c=>c.id===p.categoryId)}
              prog={progMap[p.id]||defProg(p.id)}
              flat={true} />
          ))
      ) : (
        cats.map(cat => {
          const catPhrases = phrases.filter(p => p.categoryId === cat.id);
          const isOpen     = !!openCats[cat.id];
          return (
            <div key={cat.id} className="mb-8">
              <button
                onClick={() => setOpenCats(prev => ({...prev, [cat.id]: !prev[cat.id]}))}
                style={{
                  width:'100%', display:'flex', alignItems:'center',
                  background:'white', border:'1.5px solid var(--border)',
                  borderRadius: isOpen ? '12px 12px 0 0' : '12px',
                  padding:'14px 16px', cursor:'pointer', fontFamily:'inherit'
                }}>
                <span style={{flex:1, fontWeight:700, fontSize:15, textAlign:'left'}}>{cat.name}</span>
                <span style={{fontSize:13, color:'var(--text-sub)', marginRight:8}}>{catPhrases.length}件</span>
                <span style={{fontSize:12, color:'var(--text-sub)'}}>{isOpen ? '▲' : '▼'}</span>
              </button>
              {isOpen && (
                <div style={{border:'1.5px solid var(--border)', borderTop:'none',
                  borderRadius:'0 0 12px 12px', overflow:'hidden'}}>
                  {catPhrases.map(p => (
                    <PhraseRow key={p.id} phrase={p} cat={cat}
                      prog={progMap[p.id]||defProg(p.id)}
                      flat={false} />
                  ))}
                </div>
              )}
            </div>
          );
        })
      )}
    </div>
  );
}

function PhraseRow({ phrase, cat, prog, flat }) {
  const sc = prog.lastScore==='easy'?'#16a34a':prog.lastScore==='hard'?'#d97706':prog.lastScore==='again'?'#dc2626':'#9ca3af';
  const style = flat
    ? { borderRadius:'var(--radius)', marginBottom:8, background:'white', boxShadow:'var(--shadow)' }
    : { borderRadius:0, borderBottom:'1px solid var(--border)', marginBottom:0, background:'white' };
  return (
    <div style={{padding:'14px 16px', ...style}}>
      <div className="flex justify-between items-center mb-4">
        {flat && <span className="text-xs" style={{color:'#9ca3af'}}>{cat?.name}</span>}
        {!flat && <span style={{width:1}}></span>}
        <span className="text-xs" style={{color:sc}}>{prog.totalReviews}回 · {prog.streak}連続</span>
      </div>
      <div style={{fontWeight:600, fontSize:15, marginBottom:4}}>{phrase.english}</div>
      <div className="text-sm text-sub">{phrase.japanese}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
