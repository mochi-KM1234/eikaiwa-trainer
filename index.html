<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>英会話フレーズトレーナー</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #2563eb; --primary-light: #eff6ff;
      --success: #16a34a; --warning: #d97706; --danger: #dc2626;
      --text: #1f2937; --text-sub: #6b7280; --border: #e5e7eb;
      --bg: #f3f4f6; --card: #ffffff; --radius: 14px;
      --shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    #root { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

    .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 14px;
      display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 100; }
    .header-title { font-size: 16px; font-weight: 700; flex: 1; }
    .lang-link { font-size: 12px; font-weight: 700; color: var(--text); text-decoration: none; white-space: nowrap;
      border: 1.5px solid var(--border); border-radius: 99px; padding: 3px 10px; }
    .ver-badge { font-size: 10px; color: #92400e; background: #fef3c7; padding: 2px 8px; border-radius: 99px;
      font-weight: 700; white-space: nowrap; }

    .nav { background: var(--card); border-top: 1px solid var(--border); display: flex;
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 8px 4px 10px; border: none; background: none; font-size: 10px;
      color: var(--text-sub); cursor: pointer; gap: 3px; font-family: inherit; }
    .nav-item.active { color: var(--primary); }
    .nav-item svg { width: 22px; height: 22px; }

    .content { flex: 1; padding: 14px 14px 84px; }
    .content.study-mode { padding: 10px 12px calc(92px + env(safe-area-inset-bottom)); }

    .btn { border: none; border-radius: 10px; padding: 13px 20px; font-size: 15px;
      font-weight: 600; cursor: pointer; display: inline-flex; align-items: center;
      justify-content: center; gap: 6px; transition: opacity .1s, transform .1s;
      -webkit-user-select: none; user-select: none; font-family: inherit; }
    .btn:active { opacity: .78; transform: scale(.97); }
    .btn-primary { background: var(--primary); color: white; width: 100%; }
    .btn-ghost   { background: white; color: var(--text); border: 1.5px solid var(--border); }
    .btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
    .w-full { width: 100%; }

    .input { width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
      padding: 11px 14px; font-size: 15px; font-family: inherit; outline: none;
      background: white; color: var(--text); }
    .input:focus { border-color: var(--primary); }

    .tag { display: inline-block; background: var(--primary-light); color: var(--primary);
      padding: 3px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; }
    .pill { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 99px;
      background: #fef3c7; color: #92400e; white-space: nowrap; vertical-align: 2px; }

    /* ホーム */
    .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat-card { background: var(--card); border-radius: var(--radius); padding: 12px;
      text-align: center; box-shadow: var(--shadow); }
    .stat-num { font-size: 24px; font-weight: 700; color: var(--primary); }
    .stat-label { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
    .sub-note { font-size: 11px; color: var(--text-sub); text-align: center; margin: 2px 0 16px; line-height: 1.5; }
    .section-label { font-size: 12px; font-weight: 700; color: var(--text-sub); letter-spacing: .06em; margin-bottom: 8px; }
    .cat-btn { display: flex; align-items: center; background: white; border: 1.5px solid var(--border);
      border-radius: 12px; padding: 12px 14px; font-size: 14px; cursor: pointer; width: 100%;
      margin-bottom: 7px; font-weight: 500; font-family: inherit; text-align: left; color: var(--text); }
    .cat-btn:active { border-color: var(--primary); background: var(--primary-light); }
    .cat-meta { font-size: 12px; color: #9ca3af; white-space: nowrap; margin-left: 8px; }

    /* 練習 */
    .study-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .prog-wrap { background: var(--border); border-radius: 99px; height: 5px; flex: 1; }
    .prog-fill { height: 100%; border-radius: 99px; background: var(--primary); transition: width .3s; }
    .q-card { background: var(--card); border-radius: 14px; padding: 14px 14px 12px;
      text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 8px; }
    .q-cat { font-size: 11px; color: var(--text-sub); margin-bottom: 6px; }
    .q-retry { color: var(--danger); font-weight: 700; }
    .q-jp { font-size: 18px; font-weight: 700; line-height: 1.5; }
    .hint-area { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
    .hint-reading { font-size: 14px; color: var(--text-sub); margin-top: 10px; }

    .ans { background: #f8faff; border: 1.5px solid #c7d7f5; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
    .ans-main { font-size: 18px; font-weight: 700; color: var(--primary); line-height: 1.5; }
    .ans-reading { font-size: 12px; color: var(--text-sub); margin-top: 1px; }
    .ans-short { margin-top: 6px; font-size: 15px; font-weight: 700; color: #b45309; line-height: 1.5; }

    .info { border-radius: 12px; padding: 7px 12px 8px; margin-bottom: 8px; border: 1.5px solid; }
    .info-sim  { background: #f0f9ff; border-color: #bae6fd; }
    .info-idi  { background: #fdf4ff; border-color: #e9d5ff; }
    .info-var  { background: #f0fdf4; border-color: #bbf7d0; }
    .info-ttl { font-size: 11px; font-weight: 700; color: var(--text-sub); margin-bottom: 2px; }
    .info-item { font-size: 13.5px; line-height: 1.5; padding: 4px 0; }
    .info-item + .info-item { border-top: 1px dashed rgba(0,0,0,.08); }
    .info-term { font-weight: 700; color: #7c3aed; }
    .info-label { font-weight: 700; color: #16a34a; margin-right: 6px; font-size: 12px; }
    .info-sub { font-size: 12px; color: var(--text-sub); }

    .tw { cursor: pointer; border-radius: 4px; }
    .tw:active { background: #dbeafe; }
    .say-btn { border: none; background: none; font-size: 15px; padding: 0 2px 0 6px; cursor: pointer;
      vertical-align: baseline; line-height: 1; }

    /* 下部固定の操作バー */
    .action-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px; background: rgba(255,255,255,.97); border-top: 1px solid var(--border);
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); display: flex; gap: 6px; z-index: 100; }
    .ab-back { flex: 0 0 46px; border: 1.5px solid var(--border); background: white; border-radius: 12px;
      font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; color: var(--text); line-height: 1.2; }
    .ab-back:disabled { opacity: .3; cursor: default; }
    .ab-main { flex: 1; min-height: 52px; }
    .ab-note { position: absolute; left: 0; right: 0; top: -22px; text-align: center; font-size: 11px; }
    .ab-note span { background: #1f2937; color: white; padding: 2px 10px; border-radius: 99px; }
    .score-btn { flex: 1; border: none; border-radius: 12px; padding: 7px 4px; font-size: 13px;
      font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center;
      gap: 1px; -webkit-user-select: none; user-select: none; font-family: inherit; }
    .score-btn:active { opacity: .78; transform: scale(.97); }
    .score-btn .emoji { font-size: 18px; line-height: 1.2; }
    .score-btn.sel { box-shadow: inset 0 0 0 3px currentColor; }
    .score-again { background: #fee2e2; color: var(--danger); }
    .score-hard  { background: #fef3c7; color: #92400e; }
    .score-easy  { background: #dcfce7; color: #166534; }

    .session-done { text-align: center; padding: 40px 16px; }
    .session-done .big-emoji { font-size: 56px; margin-bottom: 12px; }
    .session-done h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .done-counts { display: flex; justify-content: center; gap: 14px; font-size: 14px; margin: 12px 0 20px; }

    /* 一覧 */
    .list-tools { display: flex; gap: 8px; margin-bottom: 10px; }
    .chip { border: 1.5px solid var(--border); background: white; border-radius: 99px; padding: 0 12px;
      font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; color: var(--text-sub); white-space: nowrap; }
    .chip.on { border-color: var(--danger); color: var(--danger); background: #fff1f2; }
    .cat-head { width: 100%; display: flex; align-items: center; background: white; border: 1.5px solid var(--border);
      padding: 12px 14px; cursor: pointer; font-family: inherit; color: var(--text); }
    .row { padding: 11px 14px; background: white; cursor: pointer; }
    .row-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #9ca3af; margin-bottom: 3px; gap: 8px; }
    .row-en { font-weight: 600; font-size: 15px; line-height: 1.45; }
    .row-ja { font-size: 13px; color: var(--text-sub); margin-top: 2px; }
    .row-short { font-size: 13px; color: #b45309; font-weight: 600; margin-top: 4px; }
    .row-open { margin-top: 8px; }
    .mb-8 { margin-bottom: 8px; }
  </style>
</head>

const uid = () => Math.random().toString(36).slice(2,10);

const WEAK_TH = 0.3;       // 苦手度がこれ以上なら「苦手」

const STOP = new Set(['the','a','an','to','of','for','and','is','are','i','you','me','my','we',
  'this','that','it','in','on','with','some','more','could','would','may','like','please','have',
  'be','do','at','by','from','or','not','so','if','as','up','out','but','can','just','here','there',

  'same','came','away','these','other','most','did','does','need','want','go','let','put','see',
  'use','way','one','new','will','still','each','those']);

function guessKw(text) {
  return [...new Set(text.toLowerCase().replace(/[^a-z0-9\s'-]/g,' ').split(/\s+/)
    .filter(w => w.length >= 3 && !STOP.has(w)).slice(0,4))];
}
function shuffle(a) {
  const b = [...a];
  for (let i=b.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; }
  return b;
}
// 重み付きランダム抽出（重いほど選ばれやすい・重複なし）
function weightedPick(items, weightOf, n) {
  const pool=[...items], out=[];
  while (pool.length && out.length<n) {
    const total = pool.reduce((s,x)=>s+weightOf(x),0);
    let r = Math.random()*total, k = 0;
    for (; k<pool.length-1; k++) { r -= weightOf(pool[k]); if (r<=0) break; }
    out.push(pool.splice(k,1)[0]);
  }
  return out;
}

const ALIAS = {"p005": "p001", "p009": "p001", "p010": "p006", "p052": "p020", "p152": "p021", "p203": "p040", "p179": "p045", "p192": "p062", "p187": "p063", "p080": "p064", "p134": "p082", "p160": "p117", "p156": "p120", "p181": "p125", "p229": "p125", "p177": "p136", "p026": "p150", "p223": "p175", "p228": "p185", "p205": "p258", "p206": "p278", "p208": "p279"};

// ── 発音（端末の読み上げ機能を使う） ─────────────────────────────
const synth = window.speechSynthesis;
if (synth && 'onvoiceschanged' in synth) synth.onvoiceschanged = () => {};
function pickVoice() {
  try {
    const want = CONF.speechLang.toLowerCase();
    const vs = synth.getVoices();
    return vs.find(v=>v.lang.toLowerCase().replace('_','-')===want)
        || vs.find(v=>v.lang.toLowerCase().startsWith(want.slice(0,2))) || null;
  } catch { return null; }
}
function speak(text, rate) {
  if (!synth || !text) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = CONF.speechLang; u.rate = rate || 0.9;
  const v = pickVoice(); if (v) u.voice = v;
  synth.speak(u);
}
function cleanWord(w) {
  return w.replace(/^[^A-Za-z0-9À-ÖØ-öø-ÿœŒ']+|[^A-Za-z0-9À-ÖØ-öø-ÿœŒ']+$/g, '');
}
// 単語タップでその単語、🔊で文全体を読み上げる
function Say({ text }) {
  if (!text) return null;
  return (
    <span>
      {text.split(/(\s+)/).map((w,i)=> (!w || /^\s+$/.test(w)) ? w :
        <span key={i} className="tw" onClick={e=>{ e.stopPropagation(); const c=cleanWord(w); if (c) speak(c, 0.8); }}>{w}</span>
      )}
      <button className="say-btn" aria-label="全文を読み上げ" onClick={e=>{ e.stopPropagation(); speak(text); }}>🔊</button>
    </span>
  );
}

// ── Storage hook ──────────────────────────────────────────────────
function useStorage(key, init) {
  const [state, setState] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; }
  });
  const upd = useCallback((fn) => {
    setState(prev => {
      const next = typeof fn === 'function' ? fn(prev) : fn;
      try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
      return next;
    });
  }, [key]);
  return [state, upd];
}

// ── SM-2（次に出す日を決める） ────────────────────────────────────
function defProg(phraseId) {
  return { phraseId, streak:0, intervalDays:0, nextReviewAt:now(), totalReviews:0, lastScore:null, easeFactor:2.5 };
}
function nextProg(p, score) {
  const n = { ...p, totalReviews:p.totalReviews+1, lastScore:score };
  if (score==='again') {
    n.streak=0; n.intervalDays=0; n.easeFactor=Math.max(1.3, n.easeFactor-0.2); n.nextReviewAt=daysLater(0);
  } else if (score==='hard') {
    n.streak=Math.max(1,n.streak+1); n.intervalDays=Math.max(1,Math.round((n.intervalDays||1)*1.3));
    n.easeFactor=Math.max(1.5,n.easeFactor-0.05); n.nextReviewAt=daysLater(n.intervalDays);
  } else {
    n.streak+=1; n.easeFactor=Math.min(3.0,n.easeFactor+0.08);
    n.intervalDays=n.intervalDays===0?2:Math.round(n.intervalDays*n.easeFactor);
    n.nextReviewAt=daysLater(n.intervalDays);
  }
  return n;
}

// ── 苦手度：採点履歴の直近5回を、新しいほど重く数える ─────────────
// できない=1 / むずかしい=0.5 / できた=0 の重み付き平均（0〜1）
const SCORE_VAL = { again:1, hard:0.5, easy:0 };
const RECENT_W  = [1, 0.6, 0.36, 0.22, 0.13];
function buildStats(logs) {
  const st = {};
  for (const l of logs) {                         // logs は新しい順
    const id = ALIAS[l.phraseId] || l.phraseId;   // 統合で消えたフレーズの履歴は統合先へ
    const s = st[id] || (st[id] = { again:0, hard:0, easy:0, recent:[] });
    if (s[l.selfScore] !== undefined) s[l.selfScore]++;
    if (s.recent.length < RECENT_W.length) s.recent.push(l.selfScore);
  }
  for (const id in st) {
    let num=0, den=0;
    st[id].recent.forEach((sc,i)=>{ num += RECENT_W[i]*(SCORE_VAL[sc] ?? 0); den += RECENT_W[i]; });
    st[id].weak = den ? num/den : 0;
  }
  return st;
}
const weakOf = (stats, id) => stats[id]?.weak || 0;

// APP
// ═══════════════════════════════════════════════════════════════════
function App() {
  const [progMap, updProg] = useStorage(CONF.keys.progress, {});
  const [logs,    updLogs] = useStorage(CONF.keys.logs,     []);
  const [screen, setScreen] = useState('home');
  const [study,  setStudy]  = useState(null);

  const stats      = useMemo(() => buildStats(logs), [logs]);
  const sortedCats = useMemo(() => [...CAT_DATA].sort((a,b)=>a.sortOrder-b.sortOrder), []);
  const isSeen     = id => (progMap[id]?.totalReviews||0) > 0 || !!stats[id];
  const progOf     = id => progMap[id] || defProg(id);

  // 出題：「復習日が来たもの」と「まだ出ていないもの」を半々でランダムに選ぶ
  function startStudy(mode, catId) {
    let pool = PHRASE_DATA;
    if (mode==='category') pool = pool.filter(p=>p.categoryId===catId);
    let picked;
    if (mode==='weak') {
      picked = weightedPick(pool.filter(p=>weakOf(stats,p.id)>=WEAK_TH), p=>weakOf(stats,p.id), SESSION_SIZE);
      if (!picked.length) { alert('苦手フレーズはまだありません。\n「できない」「むずかしい」を付けたフレーズがここに集まります。'); return; }
    } else {
      const t = Date.now(), due=[], unseen=[], later=[];
      pool.forEach(p => {
        if (!isSeen(p.id)) unseen.push(p);
        else if (new Date(progOf(p.id).nextReviewAt).getTime() <= t) due.push(p);
        else later.push(p);
      });
      const d = shuffle(due), u = shuffle(unseen), half = Math.ceil(SESSION_SIZE/2);
      let a = d.slice(0, half);
      const b = u.slice(0, SESSION_SIZE - a.length);
      if (a.length + b.length < SESSION_SIZE) a = d.slice(0, SESSION_SIZE - b.length);
      picked = [...a, ...b];
      if (picked.length < SESSION_SIZE) {
        later.sort((x,y)=>new Date(progOf(x.id).nextReviewAt)-new Date(progOf(y.id).nextReviewAt));
        picked = [...picked, ...later.slice(0, SESSION_SIZE - picked.length)];
      }
      picked = shuffle(picked);
    }
    if (!picked.length) { alert('練習できるフレーズがありません。'); return; }
    setStudy({ ids:picked.map(p=>p.id), index:0, showAnswer:false, showHint:false, results:{} });
    setScreen('study');
    window.scrollTo(0,0);
  }

  function goTo(s, ids, results, index) {
    setStudy({ ...s, ids, results, index, showAnswer: !!results[index], showHint:false });
    window.scrollTo(0,0);
  }

  // 採点。戻って押し直したときは、前の採点を取り消してから付け直す
  function recordScore(score) {
    const s = study, pos = s.index, pid = s.ids[pos];
    const prevRes = s.results[pos];
    if (prevRes && prevRes.score===score) { goTo(s, s.ids, s.results, pos+1); return; }
    const ids  = [...s.ids];
    const base = prevRes ? prevRes.prev : progOf(pid);
    if (prevRes) {
      updLogs(prev => prev.filter(l => l.id!==prevRes.logId));
      if (prevRes.requeued) {
        const j = ids.lastIndexOf(pid);
        if (j>pos && !s.results[j]) ids.splice(j,1);
      }
    }
    updProg(prev => ({ ...prev, [pid]: nextProg(base, score) }));
    const logId = uid();
    updLogs(prev => [{ id:logId, phraseId:pid, selfScore:score, reviewedAt:now() }, ...prev].slice(0,2000));
    // 「できない」は同じ回の最後にもう1回出す（1回まで）
    let requeued = false;
    const isRetry = ids.indexOf(pid) < pos;
    if (score==='again' && !isRetry && !ids.slice(pos+1).includes(pid)) { ids.push(pid); requeued = true; }
    goTo(s, ids, { ...s.results, [pos]: { score, prev:base, logId, requeued } }, pos+1);
  }

  function goBack() {
    if (!study || study.index===0) return;
    goTo(study, study.ids, study.results, study.index-1);
  }

  const NAV = [
    { key:'home', icon:<IconHome />, label:'ホーム' },
    { key:'list', icon:<IconList />, label:'一覧' },
  ];
  const TITLES = { home:CONF.title, study:'練習', list:'フレーズ一覧' };
  const VERSION_LABEL = 'GitHub Pages公開用';
  const todayCount = logs.filter(l=>new Date(l.reviewedAt).toDateString()===new Date().toDateString()).length;
  const totalReviews = Object.values(progMap).reduce((s,p)=>s+(p.totalReviews||0),0);

  return (
    <div>
      <div className="header">
        <div className="header-title">{TITLES[screen]}</div>
        {screen!=='study' && CONF.otherApp && <a className="lang-link" href={CONF.otherApp.href}>{CONF.otherApp.label}</a>}
        <span className="ver-badge">{VERSION_LABEL}</span>
      </div>
      <div className={`content${screen==='study'?' study-mode':''}`}>
        {screen==='home'  && <HomeScreen sortedCats={sortedCats} stats={stats} totalReviews={totalReviews} todayCount={todayCount} onStart={startStudy} />}
        {screen==='study' && <StudyScreen state={study} setState={setStudy} cats={CAT_DATA}
                                onScore={recordScore} onBack={goBack} onExit={()=>setScreen('home')} />}
        {screen==='list'  && <ListScreen cats={sortedCats} stats={stats} />}
      </div>
      {screen!=='study' && (
        <nav className="nav">
          {NAV.map(item=>(
            <button key={item.key} className={`nav-item ${screen===item.key?'active':''}`} onClick={()=>setScreen(item.key)}>
              {item.icon}{item.label}
            </button>
          ))}
        </nav>
      )}
    </div>
  );
}

            </button>
            <button className={`score-btn score-hard${prevRes?.score==='hard'?' sel':''}`} onClick={()=>onScore('hard')}>
              <span className="emoji">🤔</span><span>むずかしい</span>
            </button>
            <button className={`score-btn score-easy${prevRes?.score==='easy'?' sel':''}`} onClick={()=>onScore('easy')}>
              <span className="emoji">😄</span><span>できた！</span>
            </button>
          </>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// LIST
// ═══════════════════════════════════════════════════════════════════
function ListScreen({ cats, stats }) {
  const [search, setSearch]     = useState('');
  const [weakOnly, setWeakOnly] = useState(false);
  const [openCats, setOpenCats] = useState({});
  const q = search.trim().toLowerCase();
  const flat = q.length>0 || weakOnly;
  const match = p => {
    if (weakOnly && weakOf(stats,p.id) < WEAK_TH) return false;
    if (!q) return true;
    const hay = [targetOf(p), p.japanese, p.short, p.reading,
      ...(p.similar||[]).flatMap(s=>[s.text, s.ja])].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  };

  return (
    <div>
      <div className="list-tools">
        <input className="input" placeholder={`🔍 ${CONF.langName}・日本語で検索`} value={search} onChange={e=>setSearch(e.target.value)} />
        <button className={`chip${weakOnly?' on':''}`} onClick={()=>setWeakOnly(v=>!v)}>🔥苦手</button>
      </div>
      {flat ? (
        PHRASE_DATA.filter(match).map(p=>(
          <div key={p.id} className="mb-8" style={{borderRadius:'var(--radius)',overflow:'hidden',boxShadow:'var(--shadow)'}}>
            <PhraseRow phrase={p} cat={cats.find(c=>c.id===p.categoryId)} stat={stats[p.id]} flat />
          </div>
        ))
      ) : (
        cats.map(cat=>{
          const list = PHRASE_DATA.filter(p=>p.categoryId===cat.id);
          const isOpen = !!openCats[cat.id];
          return (
            <div key={cat.id} className="mb-8">
              <button className="cat-head" style={{borderRadius:isOpen?'12px 12px 0 0':'12px'}}
                onClick={()=>setOpenCats(prev=>({...prev,[cat.id]:!prev[cat.id]}))}>
                <span style={{flex:1,fontWeight:700,fontSize:15,textAlign:'left'}}>{cat.name}</span>
                <span style={{fontSize:13,color:'var(--text-sub)',marginRight:8}}>{list.length}件</span>
                <span style={{fontSize:12,color:'var(--text-sub)'}}>{isOpen?'▲':'▼'}</span>
              </button>
              {isOpen && (
                <div style={{border:'1.5px solid var(--border)',borderTop:'none',borderRadius:'0 0 12px 12px',overflow:'hidden'}}>
                  {list.map(p=>(
                    <div key={p.id} style={{borderBottom:'1px solid var(--border)'}}>
                      <PhraseRow phrase={p} cat={cat} stat={stats[p.id]} />
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })
      )}
    </div>
  );
}

function PhraseRow({ phrase, cat, stat, flat }) {
  const [open, setOpen] = useState(false);
  const weak = (stat?.weak||0) >= WEAK_TH;
  return (
    <div className="row" onClick={()=>setOpen(o=>!o)}>
      <div className="row-meta">
        <span>{flat ? cat?.name : ''}</span>
        <span>{stat ? `😓${stat.again} 🤔${stat.hard} 😄${stat.easy}` : '未練習'}{weak && <span style={{color:'var(--danger)',fontWeight:700}}> 🔥苦手</span>}</span>
      </div>
      <div className="row-en"><Say text={targetOf(phrase)} /></div>
      {phrase.reading && <div className="info-sub">{phrase.reading}</div>}
      <div className="row-ja">{phrase.japanese}</div>
      {phrase.short && <div className="row-short"><span className="pill">⚡最短</span> <Say text={phrase.short} /></div>}
      {open
        ? <div className="row-open" onClick={e=>e.stopPropagation()}><Extras phrase={phrase} /></div>
        : ((phrase.similar||[]).length>0 || (phrase.idioms||[]).length>0) && <div className="info-sub" style={{marginTop:4}}>タップで解説・類似例 ▼</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
